name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test,dev]"
          python -m pip check

      - name: Lint for syntax and undefined names
        run: ruff check --select E9,F63,F7,F82 .

      - name: Compile Python sources
        run: python -m compileall -q agents prime_editing_agent cli.py enrichment.py simulator.py

      - name: Check browser JavaScript syntax
        if: matrix.python-version == '3.12'
        run: node --check web/app.js

      - name: Run test suite
        env:
          AUDIT_SECRET_KEY: "ci-only-audit-secret-key-2026"
        run: pytest -q

      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        run: pip-audit

      - name: Verify identifier guard and HMAC audit chain
        env:
          AUDIT_SECRET_KEY: "ci-only-audit-secret-key-2026"
        run: |
          python - <<'PY'
          from agents.base import AuditLogger, PHIGuard, SecurityException

          try:
              PHIGuard.assert_no_phi("Patient MRN-994827")
          except SecurityException:
              pass
          else:
              raise SystemExit("identifier guard did not block the test identifier")

          AuditLogger.log("ci", "test", "CI_CHECK", {"status": "OK"})
          assert AuditLogger.verify_integrity() is True
          print("Identifier guard and HMAC audit verification passed.")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t crispr-prime-editing-pegdna-agent:ci .

      - name: Smoke-test API container
        run: |
          docker run -d --rm --name crispr-prime-editing-ci -p 8000:8000 \
            -e AUDIT_SECRET_KEY="ci-only-audit-secret-key-2026" \
            crispr-prime-editing-pegdna-agent:ci
          trap 'docker stop crispr-prime-editing-ci >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs crispr-prime-editing-ci
          exit 1
