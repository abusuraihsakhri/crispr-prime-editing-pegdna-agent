[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crispr-prime-editing-pegdna-engine"
version = "2.0.0"
description = "PrimeEditing-Designer: pegRNA Primer Binding & RT Template Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
crispr-prime-editing-pegdna-engine = "prime_editing_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/crispr-prime-editing-pegdna-engine"
Repository = "https://github.com/abusuraihsakhri/crispr-prime-editing-pegdna-engine.git"
