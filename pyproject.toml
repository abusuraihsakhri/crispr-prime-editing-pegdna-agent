[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crispr-prime-editing-pegdna-engine"
version = "2.0.0"
description = "Deterministic rule-based evaluation toolkit for CRISPR prime-editing design metrics"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]
dev = [
    "pip-audit>=2.7,<3",
    "ruff>=0.8,<1",
]

[project.scripts]
crispr-prime-editing-pegdna-engine = "prime_editing_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/crispr-prime-editing-pegdna-agent"
Repository = "https://github.com/abusuraihsakhri/crispr-prime-editing-pegdna-agent.git"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agents*", "prime_editing_agent*"]
